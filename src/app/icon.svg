<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7A6E"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A68"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Background circular container -->
  <rect width="32" height="32" rx="8" fill="#F4F8F7"/>
  <!-- Orbiting dashed rings -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#orbitGrad)" stroke-width="1.8" stroke-dasharray="3 2" />
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#E07A68" stroke-width="1.2" stroke-dasharray="2 1.5" />
  <!-- Center compass needle / diamond -->
  <polygon points="16,6 19,16 16,14 13,16" fill="url(#needleGrad)"/>
  <polygon points="16,26 19,16 16,18 13,16" fill="url(#orbitGrad)"/>
  <circle cx="16" cy="16" r="2" fill="#0D7A6E"/>
</svg>
